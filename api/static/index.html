<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Simulator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; color: #333; background: #fdfdfd; }
        h1 { text-align: center; color: #2c3e50; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #34495e; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; transition: 0.2s; }
        button:hover { background: #2980b9; }
        .result { margin-top: 25px; padding: 20px; border-radius: 8px; display: none; border-left: 5px solid transparent; }
        .result.high-risk { background: #ffeaea; border-left-color: #e74c3c; }
        .result.low-risk { background: #eaffe9; border-left-color: #2ecc71; }
        .high-risk-text { color: #e74c3c; font-weight: bold; }
        .low-risk-text { color: #2ecc71; font-weight: bold; }
        .value-display { float: right; font-weight: normal; color: #7f8c8d; background: #ecf0f1; padding: 2px 8px; border-radius: 12px; font-size: 0.9em; }
        ul { padding-left: 20px; }
        li { margin-bottom: 5px; color: #444; }
    </style>
</head>
<body>
    <h1>Customer Churn Simulator</h1>
    <p class="subtitle">Adjust the features below to simulate churn probability.</p>
    
    <div class="card">
        <div class="form-group">
            <label>Account Age (days): <span class="value-display" id="age-val">150</span></label>
            <input type="range" id="account_age" min="0" max="2000" value="150" oninput="document.getElementById('age-val').innerText = this.value; predictChurn()">
        </div>
        
        <div class="form-group">
            <label>Payment Amount ($): <span class="value-display" id="pay-val">95</span></label>
            <input type="range" id="payment_amount" min="10" max="200" value="95" oninput="document.getElementById('pay-val').innerText = this.value; predictChurn()">
        </div>

        <div class="form-group">
            <label>Feature Usage Count: <span class="value-display" id="feat-val">1</span></label>
            <input type="range" id="feature_usage_count" min="0" max="10" value="1" oninput="document.getElementById('feat-val').innerText = this.value; predictChurn()">
        </div>

        <div class="form-group">
            <label>Login Frequency (per week): <span class="value-display" id="login-val">2</span></label>
            <input type="range" id="login_frequency" min="0" max="30" value="2" oninput="document.getElementById('login-val').innerText = this.value; predictChurn()">
        </div>

        <div class="form-group">
            <label>Support Ticket Volume: <span class="value-display" id="ticket-val">3</span></label>
            <input type="range" id="support_ticket_volume" min="0" max="10" value="3" oninput="document.getElementById('ticket-val').innerText = this.value; predictChurn()">
        </div>

        <div class="result" id="result-box">
            <h2>Churn Probability: <span id="churn-prob"></span>%</h2>
            <h3>Prediction: <span id="churn-pred"></span></h3>
            <h4 style="margin-bottom: 5px;">Top Influencing Factors:</h4>
            <ul id="reasons-list"></ul>
        </div>
    </div>

    <script>
        // Debounce to avoid flooding the API while dragging sliders
        let timeout = null;
        
        async function predictChurn() {
            clearTimeout(timeout);
            timeout = setTimeout(async () => {
                const data = {
                    account_age: parseFloat(document.getElementById('account_age').value),
                    payment_amount: parseFloat(document.getElementById('payment_amount').value),
                    feature_usage_count: parseFloat(document.getElementById('feature_usage_count').value),
                    login_frequency: parseFloat(document.getElementById('login_frequency').value),
                    support_ticket_volume: parseFloat(document.getElementById('support_ticket_volume').value)
                };

                try {
                    const response = await fetch('/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    
                    const prob = (result.churn_probability * 100).toFixed(1);
                    document.getElementById('churn-prob').innerText = prob;
                    
                    const isHighRisk = result.prediction === 1;
                    const resultBox = document.getElementById('result-box');
                    resultBox.className = 'result ' + (isHighRisk ? 'high-risk' : 'low-risk');
                    
                    const churnPred = document.getElementById('churn-pred');
                    churnPred.innerText = isHighRisk ? "Likely to Churn (At Risk)" : "Likely to Stay (Safe)";
                    churnPred.className = isHighRisk ? 'high-risk-text' : 'low-risk-text';
                    
                    const reasonsList = document.getElementById('reasons-list');
                    reasonsList.innerHTML = '';
                    if (result.top_reasons && result.top_reasons.length > 0) {
                        result.top_reasons.forEach(reason => {
                            const li = document.createElement('li');
                            li.innerText = reason;
                            reasonsList.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.innerText = "No significant features affecting the model strongly.";
                        reasonsList.appendChild(li);
                    }

                    resultBox.style.display = 'block';
                } catch (error) {
                    console.error('API Error:', error);
                }
            }, 50); // 50ms debounce
        }
        
        // Initial prediction on load
        window.onload = predictChurn;
    </script>
</body>
</html>
